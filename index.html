<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wayne</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans+Text:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f1f3f4;
  --card: #ffffff;
  --text: #202124;
  --text-2: #5f6368;
  --line: #e8eaed;
  --hover: #f8f9fa;
  --blue: #4285f4;
  --red: #ea4335;
  --yellow: #fbbc04;
  --green: #34a853;
  --accent: #1a73e8;
  --shadow: 0 1px 2px rgba(60,64,67,.3), 0 2px 6px 2px rgba(60,64,67,.15);
  --shadow-lg: 0 4px 8px 3px rgba(60,64,67,.15), 0 1px 3px rgba(60,64,67,.3);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131314;
    --card: #1f1f21;
    --text: #e8eaed;
    --text-2: #9aa0a6;
    --line: #3c4043;
    --hover: #292a2d;
    --accent: #8ab4f8;
    --shadow: 0 1px 2px rgba(0,0,0,.6);
    --shadow-lg: 0 6px 18px rgba(0,0,0,.6);
  }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
svg { display: block; }
body {
  font-family: 'Google Sans Text', 'Noto Sans TC', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 32px 24px;
  overflow-x: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* animated background blobs */
.blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.blobs i { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .28; }
.blobs i:nth-child(1) { width: 420px; height: 420px; background: var(--blue);   top: -120px; left: -80px;  animation: drift1 22s ease-in-out infinite alternate; }
.blobs i:nth-child(2) { width: 360px; height: 360px; background: var(--red);    top: 10%; right: -100px;   animation: drift2 26s ease-in-out infinite alternate; }
.blobs i:nth-child(3) { width: 380px; height: 380px; background: var(--yellow); bottom: -140px; left: 20%;  animation: drift3 24s ease-in-out infinite alternate; }
.blobs i:nth-child(4) { width: 340px; height: 340px; background: var(--green);  bottom: 5%; right: 10%;     animation: drift1 28s ease-in-out infinite alternate-reverse; }
@keyframes drift1 { to { transform: translate(120px, 90px) scale(1.15); } }
@keyframes drift2 { to { transform: translate(-140px, 110px) scale(.9); } }
@keyframes drift3 { to { transform: translate(100px, -120px) scale(1.2); } }

/* layout: bento */
.layout {
  position: relative; z-index: 1;
  width: 100%; max-width: 1080px;
  height: min(640px, calc(100vh - 64px)); min-height: 560px;
  display: grid; grid-template-columns: 360px 1fr; gap: 16px; align-items: stretch;
}
.side .card { height: 100%; display: flex; flex-direction: column; }
.grid { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: auto 1fr 1fr; gap: 16px; min-height: 0; }
.span-6 { grid-column: 1 / -1; }
.span-2 { grid-column: span 1; }

.card {
  background: var(--card);
  border-radius: 24px;
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* entrance */
.reveal { opacity: 0; transform: translateY(24px) scale(.97); animation: reveal .7s cubic-bezier(.2,.8,.2,1) forwards; animation-delay: var(--d, 0s); }
@keyframes reveal { to { opacity: 1; transform: none; } }

/* profile */
.banner { position: relative; flex: 0 0 38%; overflow: hidden; background: linear-gradient(120deg, #4285f4, #34a853); }
.banner::before {
  content: ""; position: absolute; inset: 0;
  background: url('https://bio.wayne227304.dpdns.org/c4be9961-c8a2-42a8-8853-889d92b74374.webp') center/cover;
  animation: kenburns 18s ease-in-out infinite alternate;
}
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 50%, rgba(0,0,0,.28)); }
@keyframes kenburns { from { transform: scale(1); } to { transform: scale(1.18) translate(-2%, -2%); } }

.profile-body { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 28px 28px; text-align: center; }
.avatar-wrap { position: relative; flex-shrink: 0; width: 116px; height: 116px; margin: -88px auto 16px; animation: float 5s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-6px); } }
.avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--line); border: 4px solid var(--card); }
.dot { position: absolute; right: 4px; bottom: 4px; width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--card); background: #9aa0a6; }
.dot.online { background: var(--green); animation: pulse 2s infinite; }
.dot.idle { background: var(--yellow); }
.dot.dnd { background: var(--red); }
@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(52,168,83,.6); }
  70% { box-shadow: 0 0 0 10px rgba(52,168,83,0); }
  100% { box-shadow: 0 0 0 0 rgba(52,168,83,0); }
}
h1 { font-size: 1.7rem; font-weight: 500; letter-spacing: -.2px; }
.bio { color: var(--text-2); margin-top: 6px; font-size: .95rem; }
.chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px;
  border-radius: 999px; border: 1px solid var(--line); font-size: .82rem; color: var(--text-2); max-width: 100%;
  transition: border-color .2s, transform .2s;
}
.chip:hover { border-color: var(--accent); transform: translateY(-2px); }
.chip svg { width: 16px; height: 16px; fill: currentColor; flex-shrink: 0; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* link tiles */
.tile {
  position: relative; display: flex; flex-direction: column; justify-content: space-between; gap: 22px;
  padding: 24px; min-height: 140px; text-decoration: none; color: inherit;
  transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
}
.tile:hover { transform: translateY(-6px); box-shadow: var(--shadow-lg); }
.tile .ic {
  width: 48px; height: 48px; border-radius: 16px; color: var(--c);
  background: color-mix(in srgb, var(--c) 14%, transparent);
  display: flex; align-items: center; justify-content: center;
  transition: background .3s, color .3s, transform .4s cubic-bezier(.3,1.6,.5,1), border-radius .3s;
}
.tile .ic svg { width: 22px; height: 22px; fill: currentColor; }
.tile:hover .ic { background: var(--c); color: #fff; transform: rotate(-8deg) scale(1.12); border-radius: 50%; }
.tile .tx b { display: block; font-weight: 500; font-size: 1rem; }
.tile .tx span { font-size: .8rem; color: var(--text-2); }
.tile .arrow {
  position: absolute; top: 20px; right: 20px; width: 20px; height: 20px; fill: var(--text-2);
  opacity: 0; transform: translate(-6px, 6px); transition: opacity .3s, transform .3s, fill .3s;
}
.tile:hover .arrow { opacity: 1; transform: none; fill: var(--c); }
.tile::after {
  content: ""; position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--c);
  transition: width .4s cubic-bezier(.2,.8,.2,1);
}
.tile:hover::after { width: 100%; }

/* player */
.player { display: flex; align-items: center; gap: 20px; padding: 20px 24px; flex-wrap: wrap; }
.cover {
  position: relative; width: 64px; height: 64px; flex-shrink: 0; border-radius: 18px;
  background: conic-gradient(from 200deg, var(--blue), var(--red), var(--yellow), var(--green), var(--blue));
  transition: border-radius .5s;
}
.cover::after { content: ""; position: absolute; inset: 22px; border-radius: 50%; background: var(--card); }
.cover.spin { border-radius: 50%; animation: spin 6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.p-mid { flex: 1; min-width: 200px; }
.p-top { display: flex; align-items: center; gap: 10px; }
.eq { display: flex; align-items: flex-end; gap: 2px; height: 14px; flex-shrink: 0; }
.eq i { width: 3px; height: 4px; border-radius: 2px; background: var(--accent); transition: height .3s; }
.eq.on i { animation: eq 1s ease-in-out infinite alternate; }
.eq.on i:nth-child(2) { animation-delay: .25s; }
.eq.on i:nth-child(3) { animation-delay: .5s; }
.eq.on i:nth-child(4) { animation-delay: .15s; }
@keyframes eq { 0% { height: 3px; } 100% { height: 14px; } }
.p-title { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seek { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: .72rem; color: var(--text-2); font-variant-numeric: tabular-nums; }
.bar { position: relative; flex: 1; height: 4px; border-radius: 2px; background: var(--line); cursor: pointer; }
.bar::before { content: ""; position: absolute; inset: -10px 0; }
.fill { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: linear-gradient(90deg, var(--blue), var(--green)); border-radius: 2px; }
.fill::after { content: ""; position: absolute; right: -6px; top: -4px; width: 12px; height: 12px; border-radius: 50%; background: var(--green); transform: scale(0); transition: transform .2s; }
.bar:hover .fill::after { transform: scale(1); }
.ctrls { display: flex; align-items: center; gap: 6px; }
.btn {
  width: 44px; height: 44px; border-radius: 50%; border: none; cursor: pointer; background: transparent;
  color: var(--text-2); display: flex; align-items: center; justify-content: center;
  transition: background .2s, transform .15s;
}
.btn:hover { background: var(--hover); }
.btn:active { transform: scale(.88); }
.btn svg { width: 24px; height: 24px; fill: currentColor; }
.btn.main { width: 56px; height: 56px; background: var(--accent); color: #fff; border-radius: 18px; transition: border-radius .3s, transform .15s, filter .2s; }
.btn.main:hover { border-radius: 50%; filter: brightness(1.08); background: var(--accent); }
@media (prefers-color-scheme: dark) { .btn.main { color: #1f1f21; } }
.btn.main svg { width: 28px; height: 28px; }

/* project */
.project {
  position: relative; display: flex; align-items: center; gap: 18px; padding: 20px 24px;
  text-decoration: none; color: inherit; transition: transform .3s cubic-bezier(.2,.8,.2,1), box-shadow .3s;
}
.project:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
.project::before {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(100deg, transparent 30%, color-mix(in srgb, var(--accent) 12%, transparent) 50%, transparent 70%);
  transform: translateX(-100%); transition: transform .8s;
}
.project:hover::before { transform: translateX(100%); }
.p-ic { width: 48px; height: 48px; border-radius: 16px; background: var(--green); color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .4s cubic-bezier(.3,1.6,.5,1); }
.project:hover .p-ic { transform: rotate(10deg) scale(1.1); }
.p-ic svg { width: 24px; height: 24px; fill: currentColor; }
.project .tx { flex: 1; }
.project .tx b { display: block; font-weight: 500; }
.project .tx span { font-size: .85rem; color: var(--text-2); }
.project .go { width: 22px; height: 22px; fill: var(--text-2); transition: transform .3s; }
.project:hover .go { transform: translateX(6px); fill: var(--accent); }

/* responsive */
@media (max-width: 900px) {
  body { padding: 16px 14px 40px; }
  .layout { grid-template-columns: 1fr; }
  .side { position: static; }
  .span-2 { grid-column: span 3; }
  .tile:nth-child(5) { grid-column: span 6; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
}
</style>
