<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wayne</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://bio.wayne227304.dpdns.org/c4be9961-c8a2-42a8-8853-889d92b74374.webp') no-repeat center center fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 暗色遮罩 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.45);
            z-index: 1;
        }

        /* 下雨特效 */
        #rain-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .raindrop {
            position: absolute;
            background: linear-gradient(transparent, rgba(255, 255, 255, 0.6));
            width: 1px;
            height: 22px;
            opacity: 0.7;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translateY(-20px); }
            100% { transform: translateY(102vh); }
        }

        /* ===== 進場畫面 ===== */
        #entryScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #entryScreen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .entry-box {
            text-align: center;
            animation: pulse 2s ease-in-out infinite;
        }

        .entry-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
            color: #ffffff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .entry-sub {
            font-size: 0.95rem;
            color: #cfcfcf;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.75; transform: scale(0.97); }
        }

        /* 主容器初始隱藏，進場後才淡入 */
        .wrapper {
            position: relative;
            z-index: 3;
            width: 520px;
            max-height: 92vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 12px;
            opacity: 0;
            transform: translateY(12px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .wrapper.show {
            opacity: 1;
            transform: translateY(0);
        }

        .wrapper::-webkit-scrollbar {
            width: 4px;
        }
        .wrapper::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        /* 毛玻璃卡片樣式 */
        .card {
            background: rgba(18, 18, 26, 0.68);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 22px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.55);
            text-align: center;
        }

        /* 個人主體資訊 */
        .main-title {
            font-size: 2rem;
            font-weight: 700;
            color: #ffaa00;
            margin: 0 0 8px 0;
            letter-spacing: 0.5px;
        }

        .bio {
            font-size: 1.05rem;
            color: #d8d8d8;
            margin: 0 0 14px 0;
        }

        .location {
            font-size: 0.95rem;
            color: #9a9a9a;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        /* Discord 狀態微縮區 */
        .discord-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            text-align: left;
            margin-bottom: 20px;
        }

        .discord-avatar-container {
            position: relative;
            flex-shrink: 0;
            width: 56px;
            height: 56px;
        }

        .discord-avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .status-dot {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            position: absolute;
            bottom: 0;
            right: 0;
            border: 3px solid #12121a;
        }

        .online { background-color: #23a55a; }
        .idle { background-color: #f0b232; }
        .dnd { background-color: #f23f43; }
        .offline { background-color: #80848e; }

        .discord-info {
            overflow: hidden;
        }

        .discord-name {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .discord-activity {
            font-size: 0.9rem;
            color: #b0b0b0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
        }

        /* 社交帳戶一排圖示區 */
        .social-icons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-top: 5px;
        }

        .social-icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .social-icon-btn:hover {
            background: rgba(255, 255, 255, 0.18);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-3px);
        }

        .social-icon-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        /* 音樂播放器卡片 */
        .music-card {
            background: rgba(18, 18, 26, 0.68);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 18px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.45);
        }

        .music-top {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .music-cover {
            width: 50px;
            height: 50px;
            border-radius: 10px;
            object-fit: cover;
        }

        .music-meta {
            flex-grow: 1;
            text-align: left;
            overflow: hidden;
        }

        .music-title {
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .music-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .time-text {
            font-size: 0.8rem;
            color: #9a9a9a;
            width: 35px;
            text-align: center;
        }

        .progress-bar-container {
            flex-grow: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: #ffffff;
            border-radius: 3px;
            width: 0%;
            transition: width 0.1s linear;
        }

        .icon-btn {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            font-size: 1rem;
            padding: 0;
            opacity: 0.8;
            transition: 0.2s;
        }

        .icon-btn:hover {
            opacity: 1;
            transform: scale(1.1);
        }

        /* 專案按鈕 */
        .project-btn {
            background: rgba(18, 18, 26, 0.68);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #ffffff;
            transition: 0.2s;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.45);
        }

        .project-btn:hover {
            background: rgba(28, 28, 40, 0.85);
            border-color: rgba(255, 255, 255, 0.22);
            transform: translateY(-2px);
        }

        .project-info {
            text-align: left;
        }

        .project-name {
            font-size: 1.05rem;
            font-weight: 600;
        }

        .project-desc {
            font-size: 0.85rem;
            color: #aaaaaa;
            margin-top: 3px;
        }

        .project-arrow {
            font-size: 1.1rem;
            color: #aaaaaa;
        }
    </style>
</head>

    <audio id="bgm" src="https://bio.wayne227304.dpdns.org/e19d93f3-ab05-4a7f-b4a5-4e3a908f85aa.mp3" loop></audio>

    <script>
        // 下雨特效
        const rainContainer = document.getElementById('rain-container');
        for (let i = 0; i < 60; i++) {
            const drop = document.createElement('div');
            drop.classList.add('raindrop');
            drop.style.left = `${Math.random() * 100}vw`;
            drop.style.top = `${Math.random() * -100}px`;
            drop.style.animationDuration = `${0.6 + Math.random() * 0.8}s`;
            drop.style.animationDelay = `${Math.random() * 2}s`;
            rainContainer.appendChild(drop);
        }

        // Lanyard Discord 狀態
        const DISCORD_ID = "1515607700816265316";
        async function fetchDiscordStatus() {
            try {
                const response = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`);
                const data = await response.json();
                if (data.success) {
                    const { discord_user, discord_status, activities } = data.data;
                    document.getElementById("mainUsername").innerText = discord_user.display_name || discord_user.username;
                    document.getElementById("discordName").innerText = discord_user.display_name || discord_user.username;
                    
                    const avatarUrl = `https://cdn.discordapp.com/avatars/${discord_user.id}/${discord_user.avatar}.png`;
                    document.getElementById("avatar").src = avatarUrl;
                    document.getElementById("statusDot").className = `status-dot ${discord_status}`;

                    const actBox = document.getElementById("discordActivity");
                    if (activities && activities.length > 0) {
                        const game = activities.find(a => a.type === 0);
                        const custom = activities.find(a => a.type === 4);
                        if (game) {
                            actBox.innerText = `Playing ${game.name}`;
                        } else if (custom && custom.state) {
                            actBox.innerText = custom.state;
                        } else {
                            actBox.innerText = "Online";
                        }
                    } else {
                        actBox.innerText = "Offline";
                    }
                }
            } catch (e) {
                console.error(e);
            }
        }
        fetchDiscordStatus();
        setInterval(fetchDiscordStatus, 10000);

        // 音樂播放器邏輯
        const bgm = document.getElementById('bgm');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');
        bgm.volume = 0.4;

        function togglePlay() {
            if (bgm.paused) {
                bgm.play();
                playBtn.innerText = "❚❚";
            } else {
                bgm.pause();
                playBtn.innerText = "▶";
            }
        }

        bgm.addEventListener('loadedmetadata', () => {
            durationTimeEl.innerText = formatTime(bgm.duration);
        });

        bgm.addEventListener('timeupdate', () => {
            if (!isNaN(bgm.duration)) {
                const percent = (bgm.currentTime / bgm.duration) * 100;
                progressBar.style.width = `${percent}%`;
                currentTimeEl.innerText = formatTime(bgm.currentTime);
            }
        });

        function seekAudio(event) {
            const container = document.getElementById('progressContainer');
            const rect = container.getBoundingClientRect();
            const clickX = event.clientX - rect.left;
            const width = rect.width;
            if (!isNaN(bgm.duration)) {
                bgm.currentTime = (clickX / width) * bgm.duration;
            }
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // ===== 點擊進入邏輯 =====
        const entryScreen = document.getElementById('entryScreen');
        const wrapper = document.getElementById('wrapper');

        entryScreen.addEventListener('click', () => {
            entryScreen.classList.add('hidden');
            wrapper.classList.add('show');

            // 進入後嘗試播放音樂
            bgm.play().then(() => {
                playBtn.innerText = "❚❚";
            }).catch(() => {
                playBtn.innerText = "▶";
            });
        }, { once: true });
    </script>
